<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d">
<title id="t">ოპერაციული სისტემა პროგრამებსა და აპარატურას შორის</title>
<desc id="d">ზევით პროგრამები, შუაში ოპერაციული სისტემა ბირთვით და დრაივერებით, ქვევით აპარატურა. პროგრამა აპარატურას უშუალოდ არ ეხება, სისტემური გამოძახებით ითხოვს.</desc>
