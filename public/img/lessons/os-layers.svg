<text x="24" y="412" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ქვედა ზოლი ბირთვის პრივილეგიებზე მუშაობს; ზედა პროგრამებს შეზღუდული უფლებები აქვთ.</text>
