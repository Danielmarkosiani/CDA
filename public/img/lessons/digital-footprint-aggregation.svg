<desc id="d">სქემა: ოთხი ცალკე უმნიშვნელო დეტალი (ფოტოზე ქუჩის ნიშანი, პოსტის დრო, ჰეშთეგი, ძველი ანგარიში) ერთად ადგილსა და რუტინას აჩვენებს; ამიტომ საკუთარ კვალს თავად ამოწმებ.</desc>
