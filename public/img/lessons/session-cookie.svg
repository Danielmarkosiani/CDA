<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d">
<title id="t">შესვლა, სესია და cookie</title>
<desc id="d">ბრაუზერი აგზავნის ლოგინს და პაროლს. სერვერი ქმნის სესიას და Set-Cookie სათაურით აბრუნებს სესიის იდენტიფიკატორს. ბრაუზერი მას ყოველ შემდეგ მოთხოვნაში Cookie სათაურით უგზავნის.</desc>
<rect x="1" y="1" width="818" height="378" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">როგორ „ახსოვს“ სერვერი, რომ შესული ხარ</text>
<rect x="40" y="60" width="170" height="50" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="125.0" y="89.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#1c1f22">ბრაუზერი</text>
<rect x="610" y="60" width="170" height="50" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text x="695.0" y="89.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#1c1f22">სერვერი</text>
<line x1="125" y1="110" x2="125" y2="340" stroke="#5d646b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#agray)"/>
<line x1="695" y1="110" x2="695" y2="340" stroke="#5d646b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#agray)"/>
<line x1="125" y1="150" x2="695" y2="150" stroke="#2b7cc2" stroke-width="2" marker-end="url(#ablue)"/>
<text x="410.0" y="140" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">1. POST /login (ელფოსტა, პაროლი)</text>
<line x1="695" y1="200" x2="125" y2="200" stroke="#2f855a" stroke-width="2" marker-end="url(#agreen)"/>
<text x="410.0" y="190" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">2. Set-Cookie: sid=...; HttpOnly; SameSite=Lax</text>
<line x1="125" y1="255" x2="695" y2="255" stroke="#2b7cc2" stroke-width="2" marker-end="url(#ablue)"/>
<text x="410.0" y="245" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">3. GET /profile + Cookie: sid=...</text>
<line x1="695" y1="305" x2="125" y2="305" stroke="#2f855a" stroke-width="2" marker-end="url(#agreen)"/>
<text x="410.0" y="295" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">4. 200: შენი გვერდი</text>
<text x="410" y="360" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">sid ფარული იდენტიფიკატორია: ვისაც ის აქვს, სერვერისთვის ის ხარ</text>
</svg>
