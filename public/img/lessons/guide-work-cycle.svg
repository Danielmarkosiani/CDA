<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">გზამკვლევზე მუშაობა: პირველი ვერსიიდან გაგზავნამდე</title>
<desc id="d">სქემა: ექვსი საფეხური თანმიმდევრობით (პირველი ვერსია, დასვენება და ხმამაღლა კითხვა, მკითხველის ტესტი, ფაქტებისა და ეთიკის შემოწმება, თვითშეფასება, გაგზავნა ან პორტფოლიო); მენტორის შენიშვნის შემდეგ ბრუნდები გადახედვაზე.</desc>
<rect x="1" y="1" width="758" height="328" rx="12" fill="#ffffff" stroke="#d8dbde"/>
