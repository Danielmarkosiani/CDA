<text x="380" y="300" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">მენტორის შენიშვნის შემდეგ ან მკითხველის ტესტზე პრობლემის პოვნისას ბრუნდები საფეხურ 2-ზე</text>
<text x="380" y="322" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">ლურჯი = მუშაობა · ნარინჯისფერი = შემოწმება · მწვანე = საბოლოო ნაბიჯი</text>
