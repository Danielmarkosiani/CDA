<rect x="14" y="30" width="220" height="70" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="124.0" y="69.9" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="14" fill="#1c1f22">1. პირველი ვერსია</text>
<rect x="260" y="30" width="220" height="70" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
