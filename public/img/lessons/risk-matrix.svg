<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 590" width="480" height="590" role="img" aria-labelledby="t d">
<title id="t">რისკი = ალბათობა × გავლენა</title>
<desc id="d">ბადე 5 × 5: ჰორიზონტალურად ალბათობა 1-დან 5-მდე, ვერტიკალურად გავლენა 1-დან 5-მდე; რაც უფრო მარჯვნივ და ზემოთაა უჯრა, მით ძლიერია მისი ფერი. ხუთი რისკი: 1) სუსტი ადმინის პაროლი 4 × 4 = 16; 2) ასლების არარსებობა 3 × 5 = 15; 3) ძველი დანამატი 3 × 4 = 12; 4) ფიშინგი თანამშრომლებზე 3 × 3 = 9; 5) დენის გათიშვა 2 × 2 = 4.</desc>
<style>
