<title id="t">DNS-ის გზა: როგორ ხდება example.com-დან IP მისამართი</title>
<desc id="d">თანმიმდევრობის დიაგრამა: ბრაუზერი ეკითხება რეკურსიულ DNS სერვერს, ის კი თანმიმდევრულად root, TLD და ავტორიტეტულ სერვერს, შემდეგ პასუხს აბრუნებს.</desc>
