<text x="24" y="488" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">192.0.2.10 დოკუმენტაციისთვის დარეზერვებული მისამართია (RFC 5737), ნამდვილი საიტის IP არ არის.</text>
<text x="24" y="506" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ლურჯი: შეკითხვა · ნაცრისფერი: მიმართვა (referral) · მწვანე: პასუხი.</text>
