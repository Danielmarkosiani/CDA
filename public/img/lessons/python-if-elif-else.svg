<title id="t">if / elif / else: პირობები ზემოდან ქვემოთ მოწმდება</title>
<desc id="d">სქემა: ასაკი age ოთხ შემოწმებას გადის თანმიმდევრობით; პირველი მართალი პირობა იმარჯვებს და დანარჩენი აღარ მოწმდება.</desc>
