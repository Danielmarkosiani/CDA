<text x="380" y="400" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ერთ გაშვებაზე სრულდება ზუსტად ერთი ბლოკი: ის, რომლის პირობაც პირველმა გაიარა.</text>
<text x="380" y="424" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">ლურჯი = პირობა · მწვანე = რას დაბეჭდავს</text>
