<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="t d">
<title id="t">ბრაუზერი და სერვერი</title>
<desc id="d">ბრაუზერი აგზავნის მოთხოვნას, სერვერი პასუხობს HTML-ით, CSS-ით და JavaScript-ით. სერვერის კოდი სერვერზე სრულდება, JavaScript კი ბრაუზერში; ბაზა მხოლოდ სერვერისთვის ჩანს.</desc>
<rect x="1" y="1" width="818" height="338" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">ვინ რას ხედავს და სად სრულდება კოდი</text>
<rect x="30" y="70" width="250" height="200" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="155.0" y="149.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">ბრაუზერი (კლიენტი)</text>
<text x="155.0" y="166.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">HTML, CSS, JavaScript</text>
<text x="155.0" y="183.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">მომხმარებლის მოწყობილობაზე</text>
<text x="155.0" y="200.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">მომხმარებელს აქვს კონტროლი</text>
<rect x="540" y="70" width="250" height="110" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text x="665.0" y="112.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">სერვერი</text>
<text x="665.0" y="129.6" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">სერვერის კოდი</text>
<text x="665.0" y="146.6" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">სერვერზე სრულდება</text>
<rect x="540" y="210" width="250" height="60" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text x="665.0" y="236.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">მონაცემთა ბაზა</text>
<text x="665.0" y="253.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ბრაუზერს პირდაპირ არ ჩანს</text>
