<text x="410.0" y="95" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">მოთხოვნა: GET /page</text>
<line x1="540" y1="150" x2="280" y2="150" stroke="#2f855a" stroke-width="2" marker-end="url(#agreen)"/>
<text x="410.0" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">პასუხი: 200 + HTML</text>
<line x1="665" y1="180" x2="665" y2="210" stroke="#5d646b" stroke-width="2" marker-end="url(#agray)"/>
<text x="410" y="310" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">სერვერმა არ უნდა ენდოს იმას, რაც ბრაუზერიდან მოვიდა</text>
