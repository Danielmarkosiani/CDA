<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d">
<title id="t">ბრძანებები მილით: cat | grep | wc</title>
<desc id="d">cat ფაილს კითხულობს, grep მხოლოდ შესაბამის ხაზებს ტოვებს, wc ხაზებს ითვლის. ისარი > შედეგს ფაილში წერს.</desc>
<rect x="1" y="1" width="818" height="328" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">ერთი ბრძანების გამოსავალი მეორის შესასვლელია</text>
<rect x="30" y="90" width="200" height="90" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="130" y="124" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1f22">cat auth.log</text>
<text x="130" y="150" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ფაილს კითხულობს</text>
<rect x="310" y="90" width="200" height="90" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text x="410" y="124" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1f22">grep Failed</text>
<text x="410" y="150" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">ტოვებს მხოლოდ შესაბამის ხაზებს</text>
<rect x="590" y="90" width="200" height="90" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text x="690" y="124" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1f22">wc -l</text>
<text x="690" y="150" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ხაზებს ითვლის</text>
<line x1="230" y1="135" x2="310" y2="135" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<line x1="510" y1="135" x2="590" y2="135" stroke="#2f855a" stroke-width="2" marker-end="url(#mn)"/>
<text x="270" y="124" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">|</text>
<text x="550" y="124" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">|</text>
<line x1="690" y1="180" x2="690" y2="240" stroke="#c05621" stroke-width="2" marker-end="url(#mo)"/>
<rect x="590" y="240" width="200" height="50" rx="8" fill="#f2f3f4" stroke="#d8dbde" stroke-width="1.5"/>
<text x="690" y="270" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#1c1f22">ეკრანი ან result.txt</text>
<text x="775" y="226" text-anchor="end" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="12" fill="#1c1f22">> result.txt</text>
<text x="24" y="316" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">მილი | გადასცემს გამოსავალს შემდეგ ბრძანებას; > გამოსავალს ფაილში წერს (არსებულს გადაწერს), >> ბოლოში ამატებს.</text>
</svg>
