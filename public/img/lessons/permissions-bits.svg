<text x="410" y="288" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1f22">r (read) = 4 · w (write) = 2 · x (execute) = 1</text>
<text x="410" y="314" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">ფაილზე: r კითხვა, w ცვლილება, x გაშვება</text>
