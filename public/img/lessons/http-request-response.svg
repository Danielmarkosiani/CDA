<text x="410.0" y="372" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#1c1f22"><tspan font-weight="700" fill="#2f855a">6.</tspan> 200 OK + გვერდის შიგთავსი</text>
<text x="24" y="444" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">192.0.2.10: დოკუმენტაციისთვის დარეზერვებული მისამართი (RFC 5737).</text>
<text x="24" y="460" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ლურჯი: მოთხოვნა · მწვანე: პასუხი · ნაცრისფერი: დაშიფვრის დამყარება.</text>
