<line x1="116" y1="150" x2="404" y2="150" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<text x="260.0" y="142" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#1c1f22"><tspan font-weight="700" fill="#2b7cc2">1.</tspan> example.com-ის IP?</text>
