<text x="410.0" y="326" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#1c1f22"><tspan font-weight="700" fill="#2b7cc2">5.</tspan> GET /index.html (დაშიფრულად)</text>
