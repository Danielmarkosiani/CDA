<rect x="335" y="52" width="150" height="50" rx="8" fill="#f2f3f4" stroke="#d8dbde" stroke-width="1.5"/>
<text x="410" y="74" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1c1f22">DNS სერვერი</text>
<text x="410" y="92" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">(recursive resolver)</text>
