<line x1="116" y1="242" x2="704" y2="242" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<text x="410.0" y="234" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#1c1f22"><tspan font-weight="700" fill="#2b7cc2">3.</tspan> TCP კავშირი, პორტი 443</text>
