<text x="410.0" y="280" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#1c1f22"><tspan font-weight="700" fill="#5d646b">4.</tspan> TLS: სერტიფიკატის შემოწმება და დაშიფვრა</text>
