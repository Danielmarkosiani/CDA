<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d">
<title id="t">HTTPS მოთხოვნის გზა: DNS, TCP, TLS, HTTP</title>
<desc id="d">თანმიმდევრობის დიაგრამა: ბრაუზერი DNS-ით პოულობს მისამართს, 443 პორტზე ამყარებს კავშირს, TLS-ით ამოწმებს სერტიფიკატს და აგზავნის GET მოთხოვნას; სერვერი 200 OK-ით პასუხობს.</desc>
<rect x="1" y="1" width="818" height="468" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">რა ხდება, როცა ბრაუზერში https://example.com/index.html იხსნება</text>
