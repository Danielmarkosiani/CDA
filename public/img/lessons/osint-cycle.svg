<path class="ly" d="M234,112 L234,140" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<rect class="fb" x="84" y="140" width="300" height="60" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="234" y="164.0" text-anchor="middle" font-size="15">შეგროვება</text>
<text class="m" x="234" y="186.0" text-anchor="middle" font-size="14">ინფორმაცია ღია წყაროებიდან</text>
<circle class="dot" cx="50" cy="170" r="18" fill="#2b7cc2"/>
<text class="dot-t b" x="50" y="176" text-anchor="middle" font-size="16" fill="#ffffff">2</text>
<path class="ly" d="M234,200 L234,228" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<rect class="fb" x="84" y="228" width="300" height="60" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="234" y="252.0" text-anchor="middle" font-size="15">დამუშავება</text>
<text class="m" x="234" y="274.0" text-anchor="middle" font-size="14">დალაგება და ფორმატირება</text>
<circle class="dot" cx="50" cy="258" r="18" fill="#2b7cc2"/>
<text class="dot-t b" x="50" y="264" text-anchor="middle" font-size="16" fill="#ffffff">3</text>
<path class="ly" d="M234,288 L234,316" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<rect class="fb" x="84" y="316" width="300" height="60" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="234" y="340.0" text-anchor="middle" font-size="15">ანალიზი</text>
<text class="m" x="234" y="362.0" text-anchor="middle" font-size="14">რა დადასტურდა და რა არა?</text>
<circle class="dot" cx="50" cy="346" r="18" fill="#2b7cc2"/>
<text class="dot-t b" x="50" y="352" text-anchor="middle" font-size="16" fill="#ffffff">4</text>
<path class="ly" d="M234,376 L234,404" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<rect class="fb" x="84" y="404" width="300" height="60" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="234" y="428.0" text-anchor="middle" font-size="15">მოხსენება</text>
<text class="m" x="234" y="450.0" text-anchor="middle" font-size="14">წყაროებით გამყარებული დასკვნა</text>
<circle class="dot" cx="50" cy="434" r="18" fill="#2b7cc2"/>
<text class="dot-t b" x="50" y="440" text-anchor="middle" font-size="16" fill="#ffffff">5</text>
<path class="ly" d="M384,434 L436,434 L436,82 L390,82" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" transform="translate(458 258) rotate(-90)" text-anchor="middle" font-size="14">ციკლი</text>
</svg>
