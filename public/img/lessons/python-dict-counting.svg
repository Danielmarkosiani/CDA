<text x="380" y="312" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="14" fill="#1c1f22">counts[ip] = counts.get(ip, 0) + 1</text>
<text x="380" y="336" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">ნარინჯისფერი = FAILED ხაზი · ნაცრისფერი = გამოტოვებული (OK)</text>
