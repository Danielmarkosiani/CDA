<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" width="480" height="548" role="img" aria-labelledby="t d">
<title id="t">ფაილის გახსნა: მონაცემის გზა</title>
<desc id="d">ოთხი ბლოკი ზემოდან ქვემოთ: საცავი, RAM, პროცესორი, ეკრანი. პროგრამა და ფაილი საცავიდან RAM-ში იტვირთება (ნაბიჯები 2-3), პროცესორი RAM-დან ინსტრუქციებსა და მონაცემს ამუშავებს (4), შედეგი ეკრანზე გადის (5), შენახვისას ცვლილება RAM-იდან საცავში ბრუნდება (6).</desc>
<style>
.bg{fill:#ffffff;stroke:#d8dbde}
text{font-family:'Noto Sans Georgian','Sylfaen','Segoe UI',sans-serif;fill:#1c1f22}
.mono{font-family:ui-monospace,Consolas,Menlo,'DejaVu Sans Mono',monospace}
.m{fill:#5d646b}.b{font-weight:700}
.tb{fill:#1f6aa8}.to{fill:#a8460f}.tg{fill:#25704a}
.halo{stroke:#ffffff;stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.fb{fill:#dbeaf7;stroke:#2b7cc2}.fg{fill:#e2f1e8;stroke:#2f855a}.fo{fill:#fdebd9;stroke:#c05621}.fy{fill:#f2f3f4;stroke:#5d646b}
.lb{stroke:#2b7cc2}.lg{stroke:#2f855a}.lo{stroke:#c05621}.ly{stroke:#5d646b}
.mb{fill:#2b7cc2}.mg{fill:#2f855a}.mo{fill:#c05621}.my{fill:#5d646b}
.gc{fill:#2b7cc2}.gl{stroke:#9aa3ab}
.dot{fill:#2b7cc2}.dot-t{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1c1f22;stroke:#3a4047}
text{fill:#eceef0}
.m{fill:#adb4bb}
.tb{fill:#7dbdf0}.to{fill:#f4a868}.tg{fill:#6fcb98}
.halo{stroke:#1c1f22}
.fb{fill:#1d3a56;stroke:#6db3ec}.fg{fill:#1c3b2a;stroke:#5fc08a}.fo{fill:#4a2c17;stroke:#f0a060}.fy{fill:#2a2f34;stroke:#8d969e}
.lb{stroke:#6db3ec}.lg{stroke:#5fc08a}.lo{stroke:#f0a060}.ly{stroke:#8d969e}
.mb{fill:#6db3ec}.mg{fill:#5fc08a}.mo{fill:#f0a060}.my{fill:#8d969e}
.gc{fill:#6db3ec}.gl{stroke:#4a525a}
.dot{fill:#6db3ec}.dot-t{fill:#10202f}
}
</style>
<rect class="bg" x="1" y="1" width="478" height="546" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mb" d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mg" d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mo" d="M0 0L10 5L0 10z" fill="#c05621"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="my" d="M0 0L10 5L0 10z" fill="#5d646b"/></marker></defs>
<text class="b" x="240" y="30" text-anchor="middle" font-size="16">ფაილის გახსნა: მონაცემის გზა</text>
<text class="m" x="240" y="54" text-anchor="middle" font-size="14">1  ორჯერ დაჭერა → სისტემა პოულობს პროგრამას</text>
<rect class="fy" x="24" y="76" width="176" height="54" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="112" y="109" text-anchor="middle" font-size="16">საცავი</text>
<text class="m" x="214" y="109" text-anchor="start" font-size="14">არქივი</text>
<rect class="fy" x="24" y="240" width="176" height="54" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="112" y="273" text-anchor="middle" font-size="16">RAM</text>
<text class="m" x="214" y="273" text-anchor="start" font-size="14">სამუშაო მაგიდა</text>
<rect class="fy" x="24" y="360" width="176" height="54" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="112" y="393" text-anchor="middle" font-size="16">პროცესორი</text>
<text class="m" x="214" y="393" text-anchor="start" font-size="14">ასრულებს ინსტრუქციებს</text>
<rect class="fy" x="24" y="470" width="176" height="54" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="112" y="503" text-anchor="middle" font-size="16">ეკრანი</text>
<text class="m" x="214" y="503" text-anchor="start" font-size="14">ვიდეობარათი ხატავს სურათს</text>
<path class="lb" d="M62,130 L62,240" fill="none" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<path class="lo" d="M98,240 L98,130" fill="none" stroke="#c05621" stroke-width="2" marker-end="url(#mo)"/>
<text x="130" y="158" text-anchor="start" font-size="15"><tspan class="tb b">2–3</tspan>  ჩატვირთვა: საცავი → RAM</text>
<text class="m" x="130" y="178" text-anchor="start" font-size="14">პროგრამა და ფაილი</text>
<text x="130" y="210" text-anchor="start" font-size="15"><tspan class="to b">6</tspan>  შენახვა: RAM → საცავი</text>
<text class="m" x="130" y="230" text-anchor="start" font-size="14">მანამდე ცვლილება მხოლოდ RAM-შია</text>
<path class="lb" d="M80,294 L80,360" fill="none" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)" marker-start="url(#mb)"/>
<text x="130" y="332" text-anchor="start" font-size="15"><tspan class="tb b">4</tspan>  ინსტრუქცია და მონაცემი</text>
<path class="lg" d="M80,414 L80,470" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#mg)"/>
<text x="130" y="447" text-anchor="start" font-size="15"><tspan class="tg b">5</tspan>  შედეგი ეკრანზე</text>
</svg>
