<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="t d">
<title id="t">მონაცემი ბრძანებად იქცევა</title>
<desc id="d">ინექციის პრინციპი: მომხმარებლის ტექსტი ბრძანებას უერთდება სტრიქონად და ინტერპრეტატორი მას ბრძანების ნაწილად აღიქვამს. პარამეტრიზებული მოთხოვნა ტექსტს მონაცემად ტოვებს.</desc>
<rect x="1" y="1" width="818" height="338" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">ინექცია: სად ერევა მონაცემი ბრძანებას</text>
<rect x="30" y="60" width="360" height="110" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text x="210.0" y="102.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">არასწორად: სტრიქონის შეერთება</text>
<text x="210.0" y="119.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ბრძანება + მომხმარებლის ტექსტი</text>
<text x="210.0" y="136.6" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ინტერპრეტატორს ერთი ტექსტი ჩანს</text>
<rect x="430" y="60" width="360" height="110" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text x="610.0" y="102.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">სწორად: პარამეტრი ცალკე</text>
<text x="610.0" y="119.5" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ბრძანება ერთი არხით, ტექსტი მეორეთი</text>
<text x="610.0" y="136.6" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ტექსტი ყოველთვის მონაცემია</text>
<rect x="30" y="200" width="360" height="70" rx="8" fill="#f2f3f4" stroke="#c05621" stroke-width="1.5"/>
<text x="210.0" y="231.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">შედეგი</text>
<text x="210.0" y="248.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">მონაცემის ნაწილი შეიძლება ბრძანებად იქცეს</text>
<rect x="430" y="200" width="360" height="70" rx="8" fill="#f2f3f4" stroke="#2f855a" stroke-width="1.5"/>
<text x="610.0" y="231.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">შედეგი</text>
<text x="610.0" y="248.1" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">ტექსტი ბრძანებას ვერ ცვლის</text>
<line x1="210" y1="170" x2="210" y2="200" stroke="#c05621" stroke-width="2" marker-end="url(#aorange)"/>
<line x1="610" y1="170" x2="610" y2="200" stroke="#2f855a" stroke-width="2" marker-end="url(#agreen)"/>
<text x="410" y="306" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" fill="#5d646b">იგივე იდეა ეხება SQL-ს, HTML-ს (XSS) და ოპერაციული სისტემის ბრძანებას</text>
</svg>
