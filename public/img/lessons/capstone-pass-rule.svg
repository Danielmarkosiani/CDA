<title id="t">პროექტის დადასტურების წესი: ჯამი ≥ 8 და ეთიკა ≥ 2</title>
<desc id="d">სქემა: ხუთი კრიტერიუმი (სიზუსტე, პრაქტიკულობა, სიცხადე, ეთიკა, სტრუქტურა) თითო 0-დან 3 ქულამდე, მაქსიმუმ 15; პროექტი დადასტურდება, თუ ჯამი მინიმუმ 8-ია და ეთიკა მინიმუმ 2; სხვა შემთხვევაში მენტორი წერს შენიშვნებს და ხელახლა აგზავნი.</desc>
