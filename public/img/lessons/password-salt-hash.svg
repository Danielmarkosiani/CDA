<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 596" width="480" height="596" role="img" aria-labelledby="t d">
<title id="t">პაროლის ჰეში მარილის გარეშე და მარილით</title>
<desc id="d">ზედა ნაწილი: მარილის გარეშე ორი მომხმარებლის ერთნაირი პაროლი password ერთნაირ ჰეშს იძლევა (5e884898…). ქვედა ნაწილი: მარილით ანგარიშზე მარილი განსხვავებულია, ამიტომ ჰეშები განსხვავებულია; x7K + password იძლევა 5d251dcb…-ს, მეორე მარილით კი სხვა ჰეშს. რეალურ სისტემაში უბრალო SHA-256 არ გამოიყენება, არამედ ნელი პაროლის ჰეშ-ფუნქცია, მაგალითად scrypt.</desc>
<style>
.bg{fill:#ffffff;stroke:#d8dbde}
text{font-family:'Noto Sans Georgian','Sylfaen','Segoe UI',sans-serif;fill:#1c1f22}
.mono{font-family:ui-monospace,Consolas,Menlo,'DejaVu Sans Mono',monospace}
.m{fill:#5d646b}.b{font-weight:700}
.tb{fill:#1f6aa8}.to{fill:#a8460f}.tg{fill:#25704a}
.halo{stroke:#ffffff;stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.fb{fill:#dbeaf7;stroke:#2b7cc2}.fg{fill:#e2f1e8;stroke:#2f855a}.fo{fill:#fdebd9;stroke:#c05621}.fy{fill:#f2f3f4;stroke:#5d646b}
.lb{stroke:#2b7cc2}.lg{stroke:#2f855a}.lo{stroke:#c05621}.ly{stroke:#5d646b}
.mb{fill:#2b7cc2}.mg{fill:#2f855a}.mo{fill:#c05621}.my{fill:#5d646b}
.gc{fill:#2b7cc2}.gl{stroke:#9aa3ab}
.dot{fill:#2b7cc2}.dot-t{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1c1f22;stroke:#3a4047}
text{fill:#eceef0}
.m{fill:#adb4bb}
.tb{fill:#7dbdf0}.to{fill:#f4a868}.tg{fill:#6fcb98}
.halo{stroke:#1c1f22}
.fb{fill:#1d3a56;stroke:#6db3ec}.fg{fill:#1c3b2a;stroke:#5fc08a}.fo{fill:#4a2c17;stroke:#f0a060}.fy{fill:#2a2f34;stroke:#8d969e}
.lb{stroke:#6db3ec}.lg{stroke:#5fc08a}.lo{stroke:#f0a060}.ly{stroke:#8d969e}
.mb{fill:#6db3ec}.mg{fill:#5fc08a}.mo{fill:#f0a060}.my{fill:#8d969e}
.gc{fill:#6db3ec}.gl{stroke:#4a525a}
.dot{fill:#6db3ec}.dot-t{fill:#10202f}
}
</style>
<rect class="bg" x="1" y="1" width="478" height="594" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mb" d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mg" d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mo" d="M0 0L10 5L0 10z" fill="#c05621"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="my" d="M0 0L10 5L0 10z" fill="#5d646b"/></marker></defs>
<text class="b" x="240" y="30" text-anchor="middle" font-size="16">პაროლის ჰეში მარილის გარეშე და მარილით</text>
<rect class="fy" x="16" y="46" width="448" height="204" rx="12" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="32" y="74" text-anchor="start" font-size="15">მარილის გარეშე</text>
<rect class="fb" x="32" y="90" width="190" height="56" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="127" y="113.0" text-anchor="middle" font-size="14">მომხმარებელი 1</text>
<text class="mono" x="127" y="133.0" text-anchor="middle" font-size="14">password</text>
<path class="ly" d="M222,118 L268,118" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" x="245" y="110" text-anchor="middle" font-size="13">ჰეში</text>
<rect class="fo" x="270" y="90" width="178" height="56" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text class="mono b" x="359" y="123" text-anchor="middle" font-size="15">5e884898…</text>
<rect class="fb" x="32" y="156" width="190" height="56" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="127" y="179.0" text-anchor="middle" font-size="14">მომხმარებელი 2</text>
<text class="mono" x="127" y="199.0" text-anchor="middle" font-size="14">password</text>
<path class="ly" d="M222,184 L268,184" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" x="245" y="176" text-anchor="middle" font-size="13">ჰეში</text>
<rect class="fo" x="270" y="156" width="178" height="56" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text class="mono b" x="359" y="189" text-anchor="middle" font-size="15">5e884898…</text>
<text class="m" x="240" y="234" text-anchor="middle" font-size="14">ერთნაირი პაროლი = ერთნაირი ჰეში</text>
<rect class="fy" x="16" y="266" width="448" height="232" rx="12" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="b" x="32" y="294" text-anchor="start" font-size="15">მარილით</text>
<rect class="fb" x="32" y="310" width="190" height="56" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="127" y="333.0" text-anchor="middle" font-size="14">მომხმარებელი 1</text>
<text class="mono" x="127" y="353.0" text-anchor="middle" font-size="14">x7K + password</text>
<path class="ly" d="M222,338 L268,338" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" x="245" y="330" text-anchor="middle" font-size="13">ჰეში</text>
<rect class="fg" x="270" y="310" width="178" height="56" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text class="mono b" x="359" y="343" text-anchor="middle" font-size="15">5d251dcb…</text>
<rect class="fb" x="32" y="378" width="190" height="76" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="127" y="401.0" text-anchor="middle" font-size="14">მომხმარებელი 2</text>
<text x="127" y="421.0" text-anchor="middle" font-size="14">სხვა მარილი +</text>
<text class="mono" x="127" y="441.0" text-anchor="middle" font-size="14">password</text>
<path class="ly" d="M222,416 L268,416" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" x="245" y="408" text-anchor="middle" font-size="13">ჰეში</text>
<rect class="fg" x="270" y="378" width="178" height="76" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text class="b" x="359" y="421" text-anchor="middle" font-size="15">სხვა ჰეში</text>
<text class="m" x="240" y="482" text-anchor="middle" font-size="14">მარილი ყოველ ანგარიშზე განსხვავებულია</text>
<text class="m" x="240" y="524" text-anchor="middle" font-size="14">ეს მხოლოდ იდეაა: რეალურ სისტემაში</text>
<text class="m" x="240" y="544" text-anchor="middle" font-size="14">უბრალო SHA-256 არ გამოიყენება,</text>
<text class="m" x="240" y="564" text-anchor="middle" font-size="14">არამედ ნელი ფუნქცია (მაგ. scrypt).</text>
</svg>
