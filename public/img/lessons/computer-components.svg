<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="t d">
<title id="t">კომპიუტერის ძირითადი ნაწილები</title>
<desc id="d">პროცესორი ოპერატიულ მეხსიერებასთან ცვლის მონაცემებს, ხოლო ხანგრძლივი შენახვა დისკზეა. ჩამრთველი და ეკრანი შესვლა-გამოსვლის მოწყობილობებია.</desc>
<rect x="1" y="1" width="818" height="428" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d646b"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05621"/></marker></defs>
<text x="24" y="32" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1f22">რა მონაწილეობს, როცა ფაილს ხსნი</text>
<rect x="310" y="130" width="200" height="100" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="410" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f22">პროცესორი (CPU)</text>
<text x="410" y="190" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ასრულებს ინსტრუქციებს</text>
<text x="410" y="208" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">მილიარდობით წამში</text>
<rect x="40" y="130" width="200" height="100" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text x="140" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">ოპერატიული მეხსიერება</text>
<text x="140" y="188" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">(RAM)</text>
<text x="140" y="208" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">სწრაფი, დროებითი</text>
<rect x="580" y="130" width="200" height="100" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text x="680" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">საცავი (SSD/დისკი)</text>
<text x="680" y="188" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">ნელი, მუდმივი</text>
<text x="680" y="208" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">ფაილები რჩება გათიშვის შემდეგ</text>
<line x1="240" y1="180" x2="310" y2="180" stroke="#5d646b" stroke-width="2" marker-start="url(#mg)" marker-end="url(#mg)"/>
<line x1="510" y1="180" x2="580" y2="180" stroke="#5d646b" stroke-width="2" marker-start="url(#mg)" marker-end="url(#mg)"/>
<rect x="310" y="290" width="200" height="80" rx="8" fill="#f2f3f4" stroke="#d8dbde" stroke-width="1.5"/>
<text x="410" y="322" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f22">შესვლა/გამოსვლა</text>
<text x="410" y="342" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11.5" fill="#5d646b">კლავიატურა, ეკრანი, ქსელი</text>
<line x1="410" y1="230" x2="410" y2="290" stroke="#5d646b" stroke-width="2" marker-start="url(#mg)" marker-end="url(#mg)"/>
<text x="275" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">მონაცემები</text>
<text x="545" y="168" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">ჩატვირთვა/</text>
<text x="545" y="182" text-anchor="middle" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="11" fill="#5d646b">შენახვა</text>
<text x="24" y="408" text-anchor="start" font-family="Inter, 'Noto Sans Georgian', Sylfaen, system-ui, sans-serif" font-size="12" fill="#5d646b">პროგრამა საცავიდან RAM-ში იტვირთება, პროცესორი კი ინსტრუქციებს მხოლოდ RAM-იდან კითხულობს.</text>
</svg>
