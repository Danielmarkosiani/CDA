<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" width="480" height="410" role="img" aria-labelledby="t d">
<title id="t">ფუნქცია: შედის არგუმენტი, გამოდის შედეგი</title>
<desc id="d">გამოძახება greet("ნინო") გადასცემს მნიშვნელობას „ნინო“ პარამეტრ name-ს; ფუნქცია def greet(name) ასრულებს return f"გამარჯობა, {name}!"; return შედეგს უკან აბრუნებს: გამარჯობა, ნინო!</desc>
<style>
.bg{fill:#ffffff;stroke:#d8dbde}
text{font-family:'Noto Sans Georgian','Sylfaen','Segoe UI',sans-serif;fill:#1c1f22}
.mono{font-family:ui-monospace,Consolas,Menlo,'DejaVu Sans Mono',monospace}
.m{fill:#5d646b}.b{font-weight:700}
.tb{fill:#1f6aa8}.to{fill:#a8460f}.tg{fill:#25704a}
.halo{stroke:#ffffff;stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.fb{fill:#dbeaf7;stroke:#2b7cc2}.fg{fill:#e2f1e8;stroke:#2f855a}.fo{fill:#fdebd9;stroke:#c05621}.fy{fill:#f2f3f4;stroke:#5d646b}
.lb{stroke:#2b7cc2}.lg{stroke:#2f855a}.lo{stroke:#c05621}.ly{stroke:#5d646b}
.mb{fill:#2b7cc2}.mg{fill:#2f855a}.mo{fill:#c05621}.my{fill:#5d646b}
.gc{fill:#2b7cc2}.gl{stroke:#9aa3ab}
.dot{fill:#2b7cc2}.dot-t{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1c1f22;stroke:#3a4047}
text{fill:#eceef0}
.m{fill:#adb4bb}
.tb{fill:#7dbdf0}.to{fill:#f4a868}.tg{fill:#6fcb98}
.halo{stroke:#1c1f22}
.fb{fill:#1d3a56;stroke:#6db3ec}.fg{fill:#1c3b2a;stroke:#5fc08a}.fo{fill:#4a2c17;stroke:#f0a060}.fy{fill:#2a2f34;stroke:#8d969e}
.lb{stroke:#6db3ec}.lg{stroke:#5fc08a}.lo{stroke:#f0a060}.ly{stroke:#8d969e}
.mb{fill:#6db3ec}.mg{fill:#5fc08a}.mo{fill:#f0a060}.my{fill:#8d969e}
.gc{fill:#6db3ec}.gl{stroke:#4a525a}
.dot{fill:#6db3ec}.dot-t{fill:#10202f}
}
</style>
<rect class="bg" x="1" y="1" width="478" height="408" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mb" d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mg" d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mo" d="M0 0L10 5L0 10z" fill="#c05621"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="my" d="M0 0L10 5L0 10z" fill="#5d646b"/></marker></defs>
<text class="b" x="240" y="28" text-anchor="middle" font-size="16">ფუნქცია: შედის არგუმენტი, გამოდის შედეგი</text>
<rect class="fb" x="90" y="48" width="300" height="62" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="b" x="240" y="73.5" text-anchor="middle" font-size="15">გამოძახება</text>
<text class="mono" x="240" y="94.5" text-anchor="middle" font-size="15">greet("ნინო")</text>
<path class="lb" d="M240,110 L240,168" fill="none" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<text class="m" x="254" y="144" text-anchor="start" font-size="14">„ნინო“ → პარამეტრი name</text>
<rect class="fo" x="40" y="168" width="400" height="104" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text class="b" x="240" y="201.0" text-anchor="middle" font-size="15">ფუნქცია</text>
<text class="mono" x="240" y="225.0" text-anchor="middle" font-size="15">def greet(name):</text>
<text class="mono" x="240" y="249.0" text-anchor="middle" font-size="15">return f"გამარჯობა, {name}!"</text>
<path class="lg" d="M240,272 L240,330" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#mg)"/>
<text class="m" x="254" y="306" text-anchor="start" font-size="14">return აბრუნებს შედეგს</text>
<rect class="fg" x="90" y="330" width="300" height="58" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text class="b" x="240" y="353.5" text-anchor="middle" font-size="15">შედეგი</text>
<text x="240" y="374.5" text-anchor="middle" font-size="15">გამარჯობა, ნინო!</text>
</svg>
