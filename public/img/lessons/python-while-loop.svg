<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" width="480" height="548" role="img" aria-labelledby="t d">
<title id="t">while ციკლის გზა</title>
<desc id="d">სქემა: attempts = 0; შემოწმება attempts &lt; 3: თუ არა, ციკლი მთავრდება; თუ დიახ, პროგრამა პაროლს ითხოვს; შემოწმება pw == "secret": თუ დიახ, break წყვეტს ციკლს; თუ არა, attempts += 1 და ისარი ისევ პირველ შემოწმებაზე ბრუნდება.</desc>
<style>
.bg{fill:#ffffff;stroke:#d8dbde}
text{font-family:'Noto Sans Georgian','Sylfaen','Segoe UI',sans-serif;fill:#1c1f22}
.mono{font-family:ui-monospace,Consolas,Menlo,'DejaVu Sans Mono',monospace}
.m{fill:#5d646b}.b{font-weight:700}
.tb{fill:#1f6aa8}.to{fill:#a8460f}.tg{fill:#25704a}
.halo{stroke:#ffffff;stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.fb{fill:#dbeaf7;stroke:#2b7cc2}.fg{fill:#e2f1e8;stroke:#2f855a}.fo{fill:#fdebd9;stroke:#c05621}.fy{fill:#f2f3f4;stroke:#5d646b}
.lb{stroke:#2b7cc2}.lg{stroke:#2f855a}.lo{stroke:#c05621}.ly{stroke:#5d646b}
.mb{fill:#2b7cc2}.mg{fill:#2f855a}.mo{fill:#c05621}.my{fill:#5d646b}
.gc{fill:#2b7cc2}.gl{stroke:#9aa3ab}
.dot{fill:#2b7cc2}.dot-t{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1c1f22;stroke:#3a4047}
text{fill:#eceef0}
.m{fill:#adb4bb}
.tb{fill:#7dbdf0}.to{fill:#f4a868}.tg{fill:#6fcb98}
.halo{stroke:#1c1f22}
.fb{fill:#1d3a56;stroke:#6db3ec}.fg{fill:#1c3b2a;stroke:#5fc08a}.fo{fill:#4a2c17;stroke:#f0a060}.fy{fill:#2a2f34;stroke:#8d969e}
.lb{stroke:#6db3ec}.lg{stroke:#5fc08a}.lo{stroke:#f0a060}.ly{stroke:#8d969e}
.mb{fill:#6db3ec}.mg{fill:#5fc08a}.mo{fill:#f0a060}.my{fill:#8d969e}
.gc{fill:#6db3ec}.gl{stroke:#4a525a}
.dot{fill:#6db3ec}.dot-t{fill:#10202f}
}
</style>
<rect class="bg" x="1" y="1" width="478" height="546" rx="12" fill="#ffffff" stroke="#d8dbde"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mb" d="M0 0L10 5L0 10z" fill="#2b7cc2"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mg" d="M0 0L10 5L0 10z" fill="#2f855a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mo" d="M0 0L10 5L0 10z" fill="#c05621"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="my" d="M0 0L10 5L0 10z" fill="#5d646b"/></marker></defs>
<text class="b" x="240" y="28" text-anchor="middle" font-size="16">while ციკლის გზა</text>
<rect class="fy" x="110" y="44" width="180" height="36" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text class="mono" x="200" y="67" text-anchor="middle" font-size="14">attempts = 0</text>
<path class="ly" d="M200,80 L200,118" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<polygon class="fb" points="200,118 300,160 200,202 100,160" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="mono" x="200" y="165" text-anchor="middle" font-size="14">attempts &lt; 3 ?</text>
<path class="ly" d="M300,160 L340,160" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" x="320" y="150" text-anchor="middle" font-size="13">არა</text>
<rect class="fy" x="340" y="138" width="124" height="44" rx="8" fill="#f2f3f4" stroke="#5d646b" stroke-width="1.5"/>
<text x="402" y="155.5" text-anchor="middle" font-size="15">ციკლი</text>
<text x="402" y="174.5" text-anchor="middle" font-size="15">მთავრდება</text>
<path class="lb" d="M200,202 L200,236" fill="none" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<text class="m" x="210" y="224" text-anchor="start" font-size="13">დიახ</text>
<rect class="fb" x="95" y="236" width="210" height="52" rx="8" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text x="200" y="256.5" text-anchor="middle" font-size="15">პაროლის შეყვანა</text>
<text class="mono" x="200" y="277.5" text-anchor="middle" font-size="14">pw = input(...)</text>
<path class="lb" d="M200,288 L200,320" fill="none" stroke="#2b7cc2" stroke-width="2" marker-end="url(#mb)"/>
<polygon class="fb" points="200,320 310,364 200,408 90,364" fill="#dbeaf7" stroke="#2b7cc2" stroke-width="1.5"/>
<text class="mono" x="200" y="369" text-anchor="middle" font-size="14">pw == "secret" ?</text>
<path class="lg" d="M310,364 L352,364" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#mg)"/>
<text class="m" x="330" y="354" text-anchor="middle" font-size="13">დიახ</text>
<rect class="fg" x="352" y="342" width="112" height="44" rx="8" fill="#e2f1e8" stroke="#2f855a" stroke-width="1.5"/>
<text class="mono b" x="408" y="359.5" text-anchor="middle" font-size="14">break</text>
<text x="408" y="378.5" text-anchor="middle" font-size="14">ციკლი წყდება</text>
<path class="lo" d="M200,408 L200,440" fill="none" stroke="#c05621" stroke-width="2" marker-end="url(#mo)"/>
<text class="m" x="210" y="430" text-anchor="start" font-size="13">არა</text>
<rect class="fo" x="110" y="440" width="180" height="36" rx="8" fill="#fdebd9" stroke="#c05621" stroke-width="1.5"/>
<text class="mono" x="200" y="463" text-anchor="middle" font-size="14">attempts += 1</text>
<path class="ly" d="M110,458 L48,458 L48,160 L98,160" fill="none" stroke="#5d646b" stroke-width="2" marker-end="url(#my)"/>
<text class="m" transform="translate(34 310) rotate(-90)" text-anchor="middle" font-size="14">ციკლი მეორდება</text>
<text class="m" x="240" y="506" text-anchor="middle" font-size="14">თუ პირობა არასდროს გახდება მცდარი,</text>
<text class="m" x="240" y="526" text-anchor="middle" font-size="14">ციკლი უსასრულოდ გაგრძელდება.</text>
</svg>
